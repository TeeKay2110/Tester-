<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebSocket Tester</title>
</head>
<body>
  <h3>WebSocket Test</h3>
  <pre id="output">Connecting...</pre>

  <script>
    const output = document.getElementById("output");

    // Use a WebSocket server you own or have permission to test.
    const ws = new WebSocket("wss://eu-central-1-game6.spribegaming.com/BlueBox/websocket");

    ws.onopen = () => {
      output.textContent += "\nConnected!";
    };

    ws.onmessage = (event) => {
      output.textContent += "\n\nReceived:\n" + event.data;
    };

    ws.onerror = (error) => {
      output.textContent += "\n\nWebSocket error.";
      console.error(error);
    };

    ws.onclose = (event) => {
      output.textContent +=
        `\n\nConnection closed. Code: ${event.code}`;
    };
  </script>
</body>
</html>
