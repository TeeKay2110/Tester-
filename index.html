<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prize Wheel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050505;
    --card:#101010;
    --card2:#171717;
    --red:#ff1744;
    --red2:#a9002d;
    --gold:#ffd54a;
    --white:#fff;
    --muted:#888;
    --border:rgba(255,255,255,.09);
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 0%,rgba(255,23,68,.17),transparent 35%),
        radial-gradient(circle at 100% 100%,rgba(255,213,74,.06),transparent 30%),
        #050505;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1450px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoIcon{
    width:50px;
    height:50px;
    border-radius:15px;
    display:grid;
    place-items:center;
    font-size:25px;
    background:linear-gradient(135deg,#ff1744,#8c0027);
    box-shadow:0 0 30px rgba(255,23,68,.3);
}

.logo h1{
    font-size:22px;
}

.logo p{
    color:#888;
    font-size:11px;
    margin-top:3px;
}

.headerButtons{
    display:flex;
    gap:7px;
}

.btn{
    border:1px solid var(--border);
    background:#151515;
    color:white;
    padding:10px 14px;
    border-radius:10px;
}

.btn:hover{
    background:#222;
}

.danger{
    color:#ff6884;
    background:rgba(255,23,68,.08);
}

/* LAYOUT */

.layout{
    display:grid;
    grid-template-columns:290px minmax(450px,1fr) 290px;
    gap:17px;
}

.card{
    border:1px solid var(--border);
    border-radius:18px;
    padding:17px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.045),
        rgba(255,255,255,.01)
    );
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.cardTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
}

.cardTitle h2{
    font-size:16px;
}

.count{
    padding:4px 9px;
    border-radius:20px;
    background:#252525;
    color:#999;
    font-size:10px;
}

/* INPUT */

.inputRow{
    display:flex;
    gap:7px;
    margin-bottom:12px;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #292929;
    background:#090909;
    color:white;
    outline:none;
}

input:focus,select:focus{
    border-color:var(--red);
}

.addBtn{
    width:45px;
    min-width:45px;
    border:none;
    border-radius:10px;
    background:var(--red);
    color:white;
    font-size:22px;
}

/* LIST */

.list{
    max-height:450px;
    overflow-y:auto;
}

.listItem{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:10px;
    margin-bottom:7px;
    border-radius:10px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);
}

.itemText{
    min-width:0;
}

.itemName{
    font-size:13px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.itemMeta{
    color:#777;
    font-size:9px;
    margin-top:4px;
}

.removeBtn{
    width:27px;
    height:27px;
    border:0;
    border-radius:7px;
    color:#ff5878;
    background:rgba(255,23,68,.12);
}

.empty{
    text-align:center;
    color:#5e5e5e;
    padding:35px 10px;
    font-size:12px;
}

/* WHEEL */

.wheelCard{
    min-height:650px;
    display:flex;
    flex-direction:column;
}

.wheelHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.status{
    font-size:9px;
    letter-spacing:1px;
    padding:7px 10px;
    border-radius:20px;
    color:#28e07b;
    background:rgba(40,224,123,.09);
}

.wheelArea{
    position:relative;
    flex:1;
    min-height:500px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    border-radius:20px;
    background:
        radial-gradient(circle,rgba(255,23,68,.13),transparent 45%),
        #080808;
    border:1px solid rgba(255,255,255,.07);
}

/* POINTER */

.pointer{
    position:absolute;
    top:13px;
    left:50%;
    transform:translateX(-50%);
    width:0;
    height:0;
    border-left:18px solid transparent;
    border-right:18px solid transparent;
    border-top:34px solid #ffd54a;
    filter:drop-shadow(0 0 9px rgba(255,213,74,.7));
    z-index:20;
}

/* WHEEL */

.wheelOuter{
    position:relative;
    width:min(470px,82vw);
    height:min(470px,82vw);
    display:grid;
    place-items:center;
}

#wheelCanvas{
    width:100%;
    height:100%;
    border-radius:50%;
    transform:rotate(0deg);
    transition:transform 8.2s cubic-bezier(.10,.80,.05,1);
    box-shadow:
        0 0 0 8px #1b1b1b,
        0 0 0 11px #ffd54a,
        0 20px 60px rgba(0,0,0,.5);
}

/* CENTER */

.wheelCenter{
    position:absolute;
    width:90px;
    height:90px;
    border-radius:50%;
    display:grid;
    place-items:center;
    text-align:center;
    background:
        radial-gradient(circle,#ff4569,#980027);
    border:5px solid #ffd54a;
    box-shadow:0 0 25px rgba(255,23,68,.5);
    z-index:10;
    font-size:11px;
    font-weight:bold;
}

/* WINNER */

.winnerOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.82);
    backdrop-filter:blur(8px);
    z-index:50;
    text-align:center;
    cursor:pointer;
}

.winnerOverlay.show{
    display:flex;
    animation:overlayIn.4s ease;
}

@keyframes overlayIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

.winnerEmoji{
    font-size:60px;
    animation:bounce.8s ease infinite alternate;
}

@keyframes bounce{
    from{transform:scale(.9)}
    to{transform:scale(1.1)}
}

.winnerTitle{
    color:#ffd54a;
    font-size:11px;
    letter-spacing:4px;
    margin:8px 0;
}

.winnerName{
    font-size:clamp(30px,6vw,65px);
    font-weight:900;
}

.winnerPrize{
    margin-top:10px;
    color:#ffd54a;
    font-size:20px;
    font-weight:bold;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
    margin-top:13px;
}

.startBtn{
    height:57px;
    border:none;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:900;
    background:linear-gradient(135deg,#ff1744,#970028);
    box-shadow:0 10px 30px rgba(255,23,68,.16);
}

.startBtn:disabled{
    opacity:.45;
}

.winnerCountLabel{
    color:#888;
    font-size:10px;
    margin-bottom:5px;
}

/* PRIZES */

.prizeGallery{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    max-height:280px;
    overflow-y:auto;
}

.prizeCard{
    border:1px solid rgba(255,255,255,.07);
    border-radius:11px;
    overflow:hidden;
    background:#0c0c0c;
}

.prizeImage{
    width:100%;
    height:85px;
    object-fit:cover;
    display:block;
    background:#171717;
}

.prizeNoImage{
    height:85px;
    display:grid;
    place-items:center;
    font-size:25px;
    background:#151515;
}

.prizeInfo{
    padding:8px;
}

.prizeName{
    font-size:11px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.prizePosition{
    color:#777;
    font-size:8px;
    margin-top:3px;
}

.uploadLabel{
    display:block;
    padding:9px;
    border-radius:9px;
    background:#151515;
    color:#aaa;
    text-align:center;
    font-size:10px;
    cursor:pointer;
    margin-top:8px;
}

.uploadLabel:hover{
    background:#222;
}

input[type=file]{
    display:none;
}

/* HISTORY */

.historyCard{
    margin-top:17px;
}

.history{
    max-height:400px;
    overflow-y:auto;
}

.historyItem{
    display:flex;
    gap:12px;
    align-items:center;
    padding:12px;
    border-radius:11px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.05);
    margin-bottom:7px;
}

.historyNumber{
    width:32px;
    height:32px;
    border-radius:9px;
    display:grid;
    place-items:center;
    background:rgba(255,23,68,.1);
    color:#ff6683;
    font-weight:bold;
}

.historyName{
    font-weight:bold;
    font-size:13px;
}

.historyPrize{
    color:#ffd54a;
    font-size:11px;
    margin-top:4px;
}

.historyMode{
    color:#666;
    font-size:9px;
    margin-top:4px;
}

/* HOST CHOICE */

.hostCard{
    margin-top:17px;
    border-color:rgba(255,213,74,.12);
}

.hostHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.hostHeader h2{
    color:#ffd54a;
    font-size:16px;
}

.hostBadge{
    font-size:9px;
    padding:6px 9px;
    border-radius:20px;
    background:rgba(255,213,74,.1);
    color:#ffd54a;
}

.hostGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:15px;
}

.hostGrid label{
    display:block;
    color:#888;
    font-size:9px;
    margin-bottom:6px;
}

.hostButton{
    width:100%;
    height:53px;
    margin-top:13px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#ffd54a,#c58b00);
    color:#1b1400;
    font-weight:900;
}

.hostNote{
    margin-top:11px;
    color:#666;
    font-size:10px;
    line-height:1.5;
}

/* CONFETTI */

.confetti{
    position:fixed;
    top:-20px;
    width:8px;
    height:14px;
    z-index:99999;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}

/* MOBILE */

@media(max-width:1100px){

   .layout{
        grid-template-columns:1fr 1fr;
    }

   .wheelCard{
        grid-column:1/-1;
        grid-row:1;
    }
}

@media(max-width:700px){

   .app{
        padding:10px;
    }

   .header{
        align-items:flex-start;
    }

   .logo h1{
        font-size:18px;
    }

   .logo p{
        font-size:9px;
    }

   .headerButtons.btn{
        padding:8px;
        font-size:9px;
    }

   .layout{
        display:flex;
        flex-direction:column;
    }

   .wheelCard{
        order:-1;
        min-height:auto;
    }

   .wheelArea{
        min-height:450px;
    }

   .wheelCenter{
        width:70px;
        height:70px;
        font-size:9px;
    }

   .hostGrid{
        grid-template-columns:1fr;
    }

   .prizeGallery{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->

<header class="header">

    <div class="logo">

        <div class="logoIcon">
            🎡
        </div>

        <div>
            <h1>Prize Wheel</h1>
            <p>Professional Giveaway Selector</p>
        </div>

    </div>

    <div class="headerButtons">

        <button
            class="btn"
            onclick="saveData(true)"
        >
            💾 Save
        </button>

        <button
            class="btn danger"
            onclick="resetAll()"
        >
            Reset
        </button>

    </div>

</header>

<!-- MAIN -->

<main class="layout">

<!-- PARTICIPANTS -->

<section class="card">

    <div class="cardTitle">

        <h2>👥 Participants</h2>

        <span
            class="count"
            id="participantCount"
        >
            0
        </span>

    </div>

    <div class="inputRow">

        <input
            id="participantInput"
            placeholder="Enter name"
            autocomplete="off"
        >

        <button
            class="addBtn"
            onclick="addParticipant()"
        >
            +
        </button>

    </div>

    <div
        class="list"
        id="participantList"
    ></div>

    <button
        class="btn danger"
        style="width:100%;margin-top:10px"
        onclick="clearParticipants()"
    >
        Clear Participants
    </button>

</section>

<!-- WHEEL -->

<section class="card wheelCard">

    <div class="wheelHeader">

        <h2>🎡 Spin Wheel</h2>

        <span
            class="status"
            id="status"
        >
            READY
        </span>

    </div>

    <div class="wheelArea">

        <div class="pointer"></div>

        <div class="wheelOuter">

            <canvas
                id="wheelCanvas"
                width="900"
                height="900"
            ></canvas>

            <div class="wheelCenter">
                SPIN
            </div>

        </div>

        <div
            class="winnerOverlay"
            id="winnerOverlay"
        >

            <div class="winnerEmoji">
                🏆
            </div>

            <div class="winnerTitle">
                WINNER
            </div>

            <div
                class="winnerName"
                id="winnerName"
            ></div>

            <div
                class="winnerPrize"
                id="winnerPrize"
            ></div>

        </div>

    </div>

    <div class="controls">

        <div>

            <div class="winnerCountLabel">
                NUMBER OF WINNERS
            </div>

            <select id="winnerCount">

                <option value="1">
                    1 Winner
                </option>

                <option value="2">
                    2 Winners
                </option>

                <option value="3">
                    3 Winners
                </option>

                <option value="4">
                    4 Winners
                </option>

                <option value="5">
                    5 Winners
                </option>

            </select>

        </div>

        <button
            class="startBtn"
            id="startBtn"
            onclick="startDraw()"
        >
            🎡 SPIN THE WHEEL
        </button>

    </div>

</section>

<!-- PRIZES -->

<section class="card">

    <div class="cardTitle">

        <h2>🎁 Prizes</h2>

        <span
            class="count"
            id="prizeCount"
        >
            0
        </span>

    </div>

    <div class="inputRow">

        <input
            id="prizeInput"
            placeholder="Prize name"
            autocomplete="off"
        >

        <button
            class="addBtn"
            onclick="addPrize()"
        >
            +
        </button>

    </div>

    <label
        class="uploadLabel"
        for="prizeImageInput"
    >
        📷 Add image to next prize
    </label>

    <input
        type="file"
        id="prizeImageInput"
        accept="image/*"
    >

    <div
        class="prizeGallery"
        id="prizeGallery"
    ></div>

    <button
        class="btn danger"
        style="width:100%;margin-top:10px"
        onclick="clearPrizes()"
    >
        Clear Prizes
    </button>

</section>

</main>

<!-- HISTORY -->

<section class="card historyCard">

    <div class="cardTitle">

        <h2>🏆 Winner History</h2>

        <button
            class="btn danger"
            onclick="clearHistory()"
        >
            Clear
        </button>

    </div>

    <div
        class="history"
        id="history"
    ></div>

</section>

<!-- HOST CHOICE AT BOTTOM -->

<section class="card hostCard">

    <div class="hostHeader">

        <h2>👑 Host Choice</h2>

        <span class="hostBadge">
            HOST ONLY
        </span>

    </div>

    <div class="hostGrid">

        <div>

            <label>
                PARTICIPANT
            </label>

            <select id="hostParticipant">

                <option value="">
                    Choose participant
                </option>

            </select>

        </div>

        <div>

            <label>
                PRIZE
            </label>

            <select id="hostPrize">

                <option value="">
                    Choose prize
                </option>

            </select>

        </div>

    </div>

    <button
        class="hostButton"
        onclick="hostChoice()"
        id="hostButton"
    >
        👑 USE HOST CHOICE
    </button>

    <div class="hostNote">
        Host Choice is a separate selection mode and is recorded
        separately in the winner history.
    </div>

</section>

</div>

<script>

/* ============================================================
   DATA
============================================================ */

let participants = [];
let prizes = [];
let winners = [];

let drawing = false;
let wheelRotation = 0;

let pendingPrizeImage = null;

/* ============================================================
   ELEMENTS
============================================================ */

const participantInput =
    document.getElementById("participantInput");

const prizeInput =
    document.getElementById("prizeInput");

const prizeImageInput =
    document.getElementById("prizeImageInput");

const participantList =
    document.getElementById("participantList");

const prizeGallery =
    document.getElementById("prizeGallery");

const participantCount =
    document.getElementById("participantCount");

const prizeCount =
    document.getElementById("prizeCount");

const canvas =
    document.getElementById("wheelCanvas");

const ctx =
    canvas.getContext("2d");

const startBtn =
    document.getElementById("startBtn");

const hostButton =
    document.getElementById("hostButton");

const statusEl =
    document.getElementById("status");

const winnerCount =
    document.getElementById("winnerCount");

const historyEl =
    document.getElementById("history");

const hostParticipant =
    document.getElementById("hostParticipant");

const hostPrize =
    document.getElementById("hostPrize");

const winnerOverlay =
    document.getElementById("winnerOverlay");

const winnerName =
    document.getElementById("winnerName");

const winnerPrize =
    document.getElementById("winnerPrize");

/* ============================================================
   IMAGE SELECTION
============================================================ */

prizeImageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){
            pendingPrizeImage = null;
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                pendingPrizeImage =
                    event.target.result;

            };

        reader.readAsDataURL(file);
    }
);

/* ============================================================
   ADD PARTICIPANT
============================================================ */

function addParticipant(){

    const name =
        participantInput.value.trim();

    if(!name){

        alert(
            "Enter a participant name."
        );

        return;
    }

    participants.push({

        id:uid(),

        name:name

    });

    participantInput.value = "";

    renderParticipants();

    updateHostParticipants();

    drawWheel();

    saveData();
}

/* ============================================================
   ADD PRIZE
============================================================ */

function addPrize(){

    const name =
        prizeInput.value.trim();

    if(!name){

        alert(
            "Enter a prize name."
        );

        return;
    }

    prizes.push({

        id:uid(),

        name:name,

        image:
            pendingPrizeImage || null

    });

    prizeInput.value = "";

    pendingPrizeImage = null;

    prizeImageInput.value = "";

    renderPrizes();

    updateHostPrizes();

    saveData();
}

/* ============================================================
   PARTICIPANTS
============================================================ */

function renderParticipants(){

    participantList.innerHTML = "";

    participantCount.textContent =
        participants.length;

    if(!participants.length){

        participantList.innerHTML = `
            <div class="empty">
                No participants yet.
            </div>
        `;

        return;
    }

    participants.forEach(
        function(person,index){

            const div =
                document.createElement("div");

            div.className =
                "listItem";

            div.innerHTML = `

                <div class="itemText">

                    <div class="itemName">
                        ${escapeHTML(
                            (index+1)+". "+person.name
                        )}
                    </div>

                </div>

                <button
                    class="removeBtn"
                    onclick="removeParticipant('${person.id}')"
                >
                    ×
                </button>
            `;

            participantList.appendChild(div);
        }
    );
}

function removeParticipant(id){

    participants =
        participants.filter(
            p => p.id!== id
        );

    renderParticipants();

    updateHostParticipants();

    drawWheel();

    saveData();
}

function clearParticipants(){

    if(!participants.length)
        return;

    if(
       !confirm(
            "Clear all participants?"
        )
    )
        return;

    participants = [];

    renderParticipants();

    updateHostParticipants();

    drawWheel();

    saveData();
}

/* ============================================================
   PRIZES
============================================================ */

function renderPrizes(){

    prizeGallery.innerHTML = "";

    prizeCount.textContent =
        prizes.length;

    if(!prizes.length){

        prizeGallery.innerHTML = `
            <div
                class="empty"
                style="grid-column:1/-1"
            >
                No prizes yet.
            </div>
        `;

        return;
    }

    prizes.forEach(
        function(prize,index){

            const div =
                document.createElement("div");

            div.className =
                "prizeCard";

            let imageHTML;

            if(prize.image){

                imageHTML = `
                    <img
                        class="prizeImage"
                        src="${prize.image}"
                        alt=""
                    >
                `;

            }else{

                imageHTML = `
                    <div class="prizeNoImage">
                        🎁
                    </div>
                `;
            }

            div.innerHTML = `

                ${imageHTML}

                <div class="prizeInfo">

                    <div class="prizeName">
                        ${escapeHTML(prize.name)}
                    </div>

                    <div class="prizePosition">
                        Prize ${index+1}
                    </div>

                    <button
                        class="removeBtn"
                        style="margin-top:6px"
                        onclick="removePrize('${prize.id}')"
                    >
                        Remove
                    </button>

                </div>
            `;

            prizeGallery.appendChild(div);
        }
    );
}

function removePrize(id){

    prizes =
        prizes.filter(
            p => p.id!== id
        );

    renderPrizes();

    updateHostPrizes();

    saveData();
}

function clearPrizes(){

    if(!prizes.length)
        return;

    if(
       !confirm(
            "Clear all prizes?"
        )
    )
        return;

    prizes = [];

    renderPrizes();

    updateHostPrizes();

    saveData();
}

/* ============================================================
   DRAW WHEEL - IMPROVED BOLDER TEXT
============================================================ */

function drawWheel(){

    const size =
        canvas.width;

    ctx.clearRect(
        0,
        0,
        size,
        size
    );

    const cx =
        size/2;

    const cy =
        size/2;

    const radius =
        size/2 - 20;

    if(!participants.length){

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            radius,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "#161616";

        ctx.fill();

        ctx.strokeStyle =
            "#ffd54a";

        ctx.lineWidth = 12;

        ctx.stroke();

        ctx.fillStyle =
            "#666";

        ctx.font =
            "bold 34px Arial";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "ADD NAMES",
            cx,
            cy
        );

        return;
    }

    const total =
        participants.length;

    const slice =
        (Math.PI*2)/total;

    const colors = [

        "#ff1744",
        "#ff6d00",
        "#ffd54a",
        "#00c853",
        "#00b8d4",
        "#2979ff",
        "#651fff",
        "#d500f9",
        "#f50057",
        "#ff1744"

    ];

    for(
        let i=0;
        i<total;
        i++
    ){

        const start =
            i*slice -
            Math.PI/2;

        const end =
            start+slice;

        ctx.beginPath();

        ctx.moveTo(
            cx,
            cy
        );

        ctx.arc(
            cx,
            cy,
            radius,
            start,
            end
        );

        ctx.closePath();

        ctx.fillStyle =
            colors[
                i%colors.length
            ];

        ctx.fill();

        ctx.strokeStyle =
            "rgba(0,0,0,.55)";

        ctx.lineWidth =
            4;

        ctx.stroke();

        /* NAME - BOLDER & SMARTER */

        ctx.save();

        ctx.translate(
            cx,
            cy
        );

        ctx.rotate(
            start+slice/2
        );

        ctx.textAlign =
            "right";

        ctx.textBaseline =
            "middle";

        let fontSize;
        if(total > 25) fontSize = 16;
        else if(total > 18) fontSize = 19;
        else if(total > 12) fontSize = 22;
        else if(total > 8) fontSize = 26;
        else if(total > 4) fontSize = 30;
        else fontSize = 34;

        let name = participants[i].name;

        // smarter truncation based on count
        let maxLen = total > 15? 14 : total > 8? 18 : 22;
        if(name.length > maxLen){
            name = name.substring(0, maxLen-1)+"…";
        }

        // extra bold + outline for clarity
        ctx.font = `900 ${fontSize}px Arial, Helvetica, sans-serif`;
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(0,0,0,0.85)";
        ctx.lineWidth = fontSize * 0.22;
        ctx.strokeText(name, radius-28, 0);

        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(0,0,0,.8)";
        ctx.shadowBlur = 8;
        ctx.fillText(name, radius-28, 0);

        ctx.restore();
    }

    /* OUTER RING */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI*2
    );

    ctx.strokeStyle =
        "#ffd54a";

    ctx.lineWidth =
        10;

    ctx.stroke();

}

/* ============================================================
   START RANDOM DRAW - LONGER SUSPENSE + STAY OPEN
============================================================ */

async function startDraw(){

    if(drawing)
        return;

    if(!participants.length){

        alert(
            "Add participants first."
        );

        return;
    }

    if(!prizes.length){

        alert(
            "Add at least one prize first."
        );

        return;
    }

    const count =
        Number(
            winnerCount.value
        );

    if(
        count >
        participants.length
    ){

        alert(
            "There are not enough participants."
        );

        return;
    }

    if(
        count >
        prizes.length
    ){

        alert(
            "There are not enough prizes."
        );

        return;
    }

    drawing = true;

    startBtn.disabled = true;

    hostButton.disabled = true;

    statusEl.textContent =
        "SPINNING";

    statusEl.style.color =
        "#ffd54a";

    // ensure overlay hidden at start
    hideWinner();

    for(
        let i=0;
        i<count;
        i++
    ){

        if(
            participants.length === 0 ||
            prizes.length === 0
        )
            break;

        const winnerIndex =
            Math.floor(
                Math.random() *
                participants.length
            );

        const winner =
            participants[
                winnerIndex
            ];

        const prizeIndex =
            Math.floor(
                Math.random() *
                prizes.length
            );

        const prize =
            prizes[
                prizeIndex
            ];

        await spinWheelToIndex(
            winnerIndex
        );

        showWinner(
            winner,
            prize
        );

        recordWinner(
            winner,
            prize,
            "Fair Random"
        );

        participants.splice(
            winnerIndex,
            1
        );

        prizes.splice(
            prizeIndex,
            1
        );

        renderParticipants();

        renderPrizes();

        updateHostParticipants();

        updateHostPrizes();

        drawWheel();

        if(i < count - 1){
            // if multiple winners, wait then auto close to spin next
            await sleep(3800);
            hideWinner();
            await sleep(900);
        }
        // last winner stays open - will close only when typing new names
    }

    drawing = false;

    startBtn.disabled = false;

    hostButton.disabled = false;

    statusEl.textContent =
        "READY";

    statusEl.style.color =
        "#28e07b";

    saveData();
}

/* ============================================================
   WHEEL SPIN - LONGER
============================================================ */

function spinWheelToIndex(index){

    return new Promise(
        function(resolve){

            const total =
                participants.length;

            const slice =
                360/total;

            const segmentCenter =
                index*slice +
                slice/2;

            const target =
                360 -
                segmentCenter;

            const extra =
                360*10 + Math.random()*360;

            wheelRotation +=
                extra + target;

            canvas.style.transform =
                `rotate(${wheelRotation}deg)`;

            setTimeout(
                resolve,
                8300
            );
        }
    );
}

/* ============================================================
   SHOW WINNER
============================================================ */

function showWinner(
    winner,
    prize
){

    winnerName.textContent =
        winner.name;

    winnerPrize.textContent =
        "🎁 "+prize.name;

    winnerOverlay.classList.add(
        "show"
    );

    celebrate();
}

function hideWinner(){

    winnerOverlay.classList.remove(
        "show"
    );
}

// NEW: Close winner when you start typing new names + click overlay
participantInput.addEventListener("input", function(){
    if(winnerOverlay.classList.contains("show")){
        hideWinner();
    }
});
participantInput.addEventListener("focus", function(){
    if(winnerOverlay.classList.contains("show")){
        // small delay so you can see it's intentional
        // hide on focus after 250ms if user intends to type
        setTimeout(()=> {
            if(document.activeElement === participantInput){
                // don't auto hide on just focus, only on input - keep for UX
            }
        },250);
    }
});
winnerOverlay.addEventListener("click", hideWinner);

/* ============================================================
   HOST CHOICE
============================================================ */

function updateHostParticipants(){

    hostParticipant.innerHTML = `
        <option value="">
            Choose participant
        </option>
    `;

    participants.forEach(
        function(person){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                person.id;

            option.textContent =
                person.name;

            hostParticipant.appendChild(
                option
            );
        }
    );
}

function updateHostPrizes(){

    hostPrize.innerHTML = `
        <option value="">
            Choose prize
        </option>
    `;

    prizes.forEach(
        function(prize){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                prize.id;

            option.textContent =
                prize.name;

            hostPrize.appendChild(
                option
            );
        }
    );
}

async function hostChoice(){

    if(drawing)
        return;

    const personId =
        hostParticipant.value;

    const prizeId =
        hostPrize.value;

    if(!personId){

        alert(
            "Choose a participant."
        );

        return;
    }

    if(!prizeId){

        alert(
            "Choose a prize."
        );

        return;
    }

    const person =
        participants.find(
            p => p.id === personId
        );

    const prize =
        prizes.find(
            p => p.id === prizeId
        );

    if(!person ||!prize)
        return;

    drawing = true;

    startBtn.disabled = true;

    hostButton.disabled = true;

    statusEl.textContent =
        "HOST CHOICE";

    statusEl.style.color =
        "#ffd54a";

    await sleep(1200);

    showWinner(
        person,
        prize
    );

    recordWinner(
        person,
        prize,
        "Host Choice"
    );

    participants =
        participants.filter(
            p => p.id!== person.id
        );

    prizes =
        prizes.filter(
            p => p.id!== prize.id
        );

    renderParticipants();

    renderPrizes();

    updateHostParticipants();

    updateHostPrizes();

    drawWheel();

    saveData();

    // stays open until you type new name or click winner
    drawing = false;

    startBtn.disabled = false;

    hostButton.disabled = false;

    statusEl.textContent =
        "READY";

    statusEl.style.color =
        "#28e07b";
}

/* ============================================================
   HISTORY
============================================================ */

function recordWinner(
    person,
    prize,
    mode
){

    winners.unshift({

        id:uid(),

        name:person.name,

        prize:prize.name,

        mode:mode,

        time:new Date()
           .toLocaleString()

    });

    renderHistory();
}

function renderHistory(){

    historyEl.innerHTML = "";

    if(!winners.length){

        historyEl.innerHTML = `
            <div class="empty">
                No winners yet.
            </div>
        `;

        return;
    }

    winners.forEach(
        function(item,index){

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "historyItem";

            div.innerHTML = `

                <div class="historyNumber">
                    ${index+1}
                </div>

                <div>

                    <div class="historyName">
                        🏆 ${escapeHTML(item.name)}
                    </div>

                    <div class="historyPrize">
                        🎁 ${escapeHTML(item.prize)}
                    </div>

                    <div class="historyMode">
                        ${escapeHTML(item.mode)}
                        •
                        ${escapeHTML(item.time)}
                    </div>

                </div>
            `;

            historyEl.appendChild(
                div
            );
        }
    );
}

function clearHistory(){

    if(!winners.length)
        return;

    if(
       !confirm(
            "Clear winner history?"
        )
    )
        return;

    winners = [];

    renderHistory();

    saveData();
}

/* ============================================================
   CONFETTI
============================================================ */

function celebrate(){

    const colors = [

        "#ff1744",
        "#ffd54a",
        "#ffffff",
        "#20df78",
        "#4da3ff"

    ];

    for(
        let i=0;
        i<80;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );

        piece.className =
            "confetti";

        piece.style.left =
            Math.random()*100+
            "vw";

        piece.style.background =
            colors[
                Math.floor(
                    Math.random()*
                    colors.length
                )
            ];

        piece.style.animationDuration =
            (2+
            Math.random()*3)+
            "s";

        document.body.appendChild(
            piece
        );

        setTimeout(
            () => piece.remove(),
            5500
        );
    }
}

/* ============================================================
   STORAGE
============================================================ */

function saveData(show=false){

    localStorage.setItem(
        "prizeWheelData",
        JSON.stringify({

            participants,

            prizes,

            winners

        })
    );

    if(show){

        alert(
            "Your data has been saved."
        );
    }
}

function loadData(){

    try{

        const saved =
            localStorage.getItem(
                "prizeWheelData"
            );

        if(!saved)
            return;

        const data =
            JSON.parse(saved);

        participants =
            Array.isArray(
                data.participants
            )
           ? data.participants
            : [];

        prizes =
            Array.isArray(
                data.prizes
            )
           ? data.prizes
            : [];

        winners =
            Array.isArray(
                data.winners
            )
           ? data.winners
            : [];

    }catch(error){

        console.error(error);

    }
}

/* ============================================================
   RESET
============================================================ */

function resetAll(){

    if(
       !confirm(
            "Delete all participants, prizes and history?"
        )
    )
        return;

    participants = [];

    prizes = [];

    winners = [];

    wheelRotation = 0;

    canvas.style.transform =
        "rotate(0deg)";

    localStorage.removeItem(
        "prizeWheelData"
    );

    renderParticipants();

    renderPrizes();

    renderHistory();

    updateHostParticipants();

    updateHostPrizes();

    drawWheel();

    hideWinner();
}

/* ============================================================
   UTILITIES
============================================================ */

function sleep(ms){

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );
}

function uid(){

    if(
        crypto &&
        crypto.randomUUID
    ){

        return crypto.randomUUID();
    }

    return (
        Date.now()+
        "-" +
        Math.random()
           .toString(36)
           .substring(2)
    );
}

function escapeHTML(value){

    return String(value)
       .replace(
            /&/g,
            "&amp;"
        )
       .replace(
            /</g,
            "&lt;"
        )
       .replace(
            />/g,
            "&gt;"
        )
       .replace(
            /"/g,
            "&quot;"
        )
       .replace(
            /'/g,
            "&#039;"
        );
}

/* ============================================================
   ENTER KEY
============================================================ */

participantInput.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            addParticipant();
        }

    }
);

prizeInput.addEventListener(
    "keydown",
    function(e){

        if(e.key==="Enter"){
            addPrize();
        }

    }
);

/* ============================================================
   INITIALIZE
============================================================ */

loadData();

renderParticipants();

renderPrizes();

renderHistory();

updateHostParticipants();

updateHostPrizes();

drawWheel();

</script>
