<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebSocket Message Viewer</title>
</head>
<body>
  <h3>WebSocket Messages</h3>
  <pre id="output">Connecting...</pre>

  <script>
    const output = document.getElementById("output");

    function log(message) {
      output.textContent += "\n" + message;
    }

    const ws = new WebSocket("wss://eu-central-1-game6.spribegaming.com/BlueBox/websocket");

    ws.onopen = () => {
      log("✅ Connected");
    };

    ws.onmessage = (event) => {
      log("\n📨 Incoming message:");
      
      if (typeof event.data === "string") {
        log(event.data);
      } else if (event.data instanceof Blob) {
        log(`[Binary Blob: ${event.data.size} bytes]`);

        event.data.text().then(text => {
          log(text);
        });
      } else if (event.data instanceof ArrayBuffer) {
        log(`[Binary data: ${event.data.byteLength} bytes]`);
      }
    };

    ws.onerror = () => {
      log("❌ WebSocket error");
    };

    ws.onclose = (event) => {
      log(`\n🔌 Closed — code: ${event.code}`);
    };
  </script>
</body>
</html>
